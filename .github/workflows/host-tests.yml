name: Host tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.compiler }} host simulations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate integration patch syntax
        run: git apply --stat integrations/vivalalvent/rtc-s3-selftest-hook.diff

      - name: Run host simulations
        run: |
          make clean
          make test
